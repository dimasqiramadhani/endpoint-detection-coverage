# auditd Rules — ubnsrv-agent (Ubuntu 22.04.5 LTS)
# Generated from: auditctl -l
# Loaded since: 2026-05-18 (service active)
#
# This ruleset is MITRE ATT&CK-mapped, covering a wide range of
# detection categories. Rules added at runtime via auditctl are
# shown here as-is. For persistence, these should live in:
#   /etc/audit/rules.d/audit.rules
#
# NOTE: Two rules were added manually during lab testing:
#   -w /etc/shadow -p rwa -k shadow_access
#   -w /etc/passwd -p rwa -k passwd_access
# These appear at the bottom of the loaded ruleset.
#
# Wazuh custom detection rules for these audit keys: see rules/local_rules.xml

# ── Noise exclusions ─────────────────────────────────────────────────────────
-a never,user -F subj_type=crond_t
-a never,exit -S all -F subj_type=crond_t
-a never,exit -F arch=b32 -S fork -F success=0 -F path=/usr/lib/vmware-tools -F subj_type=initrc_t -F exit=-ENOENT
-a never,exit -F arch=b64 -S fork -F success=0 -F path=/usr/lib/vmware-tools -F subj_type=initrc_t -F exit=-ENOENT
-a never,exit -F arch=b32 -S all -F exe=/usr/bin/vmtoolsd
-a never,exit -F arch=b64 -S all -F exe=/usr/bin/vmtoolsd
-a never,exit -F arch=b32 -S all -F dir=/dev/shm -F key=sharedmemaccess
-a never,exit -F arch=b64 -S all -F dir=/dev/shm -F key=sharedmemaccess
-a never,exit -F arch=b32 -S all -F dir=/var/lock/lvm -F key=locklvm
-a never,exit -F arch=b64 -S all -F dir=/var/lock/lvm -F key=locklvm
-a never,exit -F arch=b32 -S all -F path=/opt/filebeat -F key=filebeat
-a never,exit -F arch=b64 -S all -F path=/opt/filebeat -F key=filebeat
-a always,exclude -F msgtype=AVC
-a always,exclude -F gid=121
-a always,exclude -F msgtype=CWD
-a always,exclude -F msgtype=CRYPTO_KEY_USER

# ── Audit self-protection (T1005 / auditlog) ─────────────────────────────────
-w /var/log/audit -p rwa -k auditlog
-w /var/log/audit -p rwa -k T1005_Data_From_Local_System_audit_log
-w /var/audit -p rwa -k T1005_Data_From_Local_System_audit_log
-w /etc/audit -p wa -k auditconfig
-w /etc/libaudit.conf -p wa -k auditconfig
-w /etc/audisp -p wa -k audispconfig
-w /sbin/auditctl -p x -k audittools
-w /sbin/auditd -p x -k audittools
-w /usr/sbin/auditd -p x -k audittools
-w /usr/sbin/augenrules -p x -k audittools
-w /usr/sbin/ausearch -p x -k T1005_Data_From_Local_System_audit_log
-w /usr/sbin/aureport -p x -k T1005_Data_From_Local_System_audit_log
-w /usr/sbin/aulast -p x -k T1005_Data_From_Local_System_audit_log
-w /usr/sbin/aulastlogin -p x -k T1005_Data_From_Local_System_audit_log
-w /usr/sbin/auvirt -p x -k T1005_Data_From_Local_System_audit_log

# ── Kernel / system ───────────────────────────────────────────────────────────
-w /etc/sysctl.conf -p wa -k sysctl
-w /etc/sysctl.d -p wa -k sysctl
-a always,exit -S all -F perm=x -F auid!=-1 -F path=/sbin/insmod -F key=modules
-a always,exit -S all -F perm=x -F auid!=-1 -F path=/sbin/modprobe -F key=modules
-a always,exit -S all -F perm=x -F auid!=-1 -F path=/sbin/rmmod -F key=modules
-a always,exit -F arch=b64 -S init_module,delete_module,finit_module -F auid!=-1 -F key=modules
-a always,exit -F arch=b32 -S init_module,delete_module,finit_module -F auid!=-1 -F key=modules
-w /etc/modprobe.conf -p wa -k modprobe
-w /etc/modprobe.d -p wa -k modprobe
-a always,exit -F arch=b64 -S kexec_load -F key=KEXEC
-a always,exit -F arch=b32 -S sys_kexec_load -F key=KEXEC
-a always,exit -F arch=b32 -S mknod,mknodat -F key=specialfiles
-a always,exit -F arch=b64 -S mknod,mknodat -F key=specialfiles
-a always,exit -F arch=b64 -S mount,umount2 -F auid!=-1 -F key=mount
-a always,exit -F arch=b32 -S mount,umount,umount2 -F auid!=-1 -F key=mount
-a always,exit -F arch=b64 -S swapon,swapoff -F auid!=-1 -F key=swap
-a always,exit -F arch=b32 -S swapon,swapoff -F auid!=-1 -F key=swap
-w /etc/localtime -p wa -k localtime

# ── Scheduled tasks / cron ────────────────────────────────────────────────────
-w /etc/cron.allow -p wa -k cron
-w /etc/cron.deny -p wa -k cron
-w /etc/cron.d -p wa -k cron
-w /etc/cron.daily -p wa -k cron
-w /etc/cron.hourly -p wa -k cron
-w /etc/cron.monthly -p wa -k cron
-w /etc/cron.weekly -p wa -k cron
-w /etc/crontab -p wa -k cron
-w /var/spool/cron -p wa -k cron

# ── Identity / credential files (etcpasswd maps to Wazuh rule 210100) ────────
-w /etc/group -p wa -k etcgroup
-w /etc/passwd -p wa -k etcpasswd
-w /etc/gshadow -p rwxa -k etcgroup
-w /etc/shadow -p rwxa -k etcpasswd
-w /etc/security/opasswd -p rwxa -k opasswd

# ── Sudo / privilege escalation (priv_esc → Wazuh rule 210101) ───────────────
-w /etc/sudoers -p wa -k actions
-w /etc/sudoers.d -p wa -k actions
-w /bin/su -p x -k priv_esc
-w /usr/bin/sudo -p x -k priv_esc
-w /etc/sudoers -p rw -k priv_esc
-w /etc/sudoers.d -p rw -k priv_esc

# ── User/group management (user_modification → Wazuh rule 210105) ────────────
-w /usr/bin/passwd -p x -k passwd_modification
-w /usr/sbin/groupadd -p x -k group_modification
-w /usr/sbin/groupmod -p x -k group_modification
-w /usr/sbin/addgroup -p x -k group_modification
-w /usr/sbin/useradd -p x -k user_modification
-w /usr/sbin/userdel -p x -k user_modification
-w /usr/sbin/usermod -p x -k user_modification
-w /usr/sbin/adduser -p x -k user_modification

# ── Login / session ───────────────────────────────────────────────────────────
-w /etc/login.defs -p wa -k login
-w /etc/securetty -p wa -k login
-w /var/log/faillog -p wa -k login
-w /var/log/lastlog -p wa -k login
-w /var/log/tallylog -p wa -k login
-w /var/run/utmp -p wa -k session
-w /var/log/btmp -p wa -k session
-w /var/log/wtmp -p wa -k session

# ── Network (remote_shell → Wazuh rule 210107) ───────────────────────────────
-a always,exit -F arch=b32 -S sethostname,setdomainname -F key=network_modifications
-a always,exit -F arch=b64 -S sethostname,setdomainname -F key=network_modifications
-a always,exit -F arch=b32 -S connect -F exe=/bin/bash -F success=1 -F key="remote_shell"
-a always,exit -F arch=b64 -S connect -F exe=/bin/bash -F success=1 -F key="remote_shell"
-a always,exit -F arch=b32 -S connect -F exe=/usr/bin/bash -F success=1 -F key="remote_shell"
-a always,exit -F arch=b64 -S connect -F exe=/usr/bin/bash -F success=1 -F key="remote_shell"
-a always,exit -F arch=b64 -S connect -F a2=0x10 -F success=1 -F key=network_connect_4
-a always,exit -F arch=b32 -S connect -F a2=0x10 -F success=1 -F key=network_connect_4
-a always,exit -F arch=b64 -S connect -F a2=0x1C -F success=1 -F key=network_connect_6
-a always,exit -F arch=b32 -S connect -F a2=0x1C -F success=1 -F key=network_connect_6
-w /etc/hosts -p wa -k network_modifications
-w /etc/network -p wa -k network

# ── SSH config (sshd → Wazuh rule 210106) ────────────────────────────────────
-w /etc/ssh/sshd_config -p rwxa -k sshd
-w /etc/ssh/sshd_config.d -p rwxa -k sshd
-w /root/.ssh -p wa -k rootkey

# ── PAM ───────────────────────────────────────────────────────────────────────
-w /etc/pam.d -p wa -k pam
-w /etc/security/limits.conf -p wa -k pam
-w /etc/security/limits.d -p wa -k pam
-w /etc/security/pam_env.conf -p wa -k pam
-w /etc/security/namespace.conf -p wa -k pam
-w /etc/security/namespace.d -p wa -k pam
-w /etc/security/namespace.init -p wa -k pam

# ── Systemd ───────────────────────────────────────────────────────────────────
-w /bin/systemctl -p x -k systemd
-w /etc/systemd -p wa -k systemd
-w /usr/lib/systemd -p wa -k systemd

# ── Recon commands (recon → Wazuh rule 210104) ────────────────────────────────
-w /usr/bin/whoami -p x -k recon
-w /usr/bin/id -p x -k recon
-w /bin/hostname -p x -k recon
-w /bin/uname -p x -k recon
-w /etc/issue -p r -k recon
-w /etc/hostname -p r -k recon

# ── Suspicious tools (susp_activity → Wazuh rule 210103) ─────────────────────
-w /usr/bin/wget -p x -k susp_activity
-w /usr/bin/curl -p x -k susp_activity
-w /usr/bin/base64 -p x -k susp_activity
-w /bin/nc -p x -k susp_activity
-w /bin/netcat -p x -k susp_activity
-w /usr/bin/ncat -p x -k susp_activity
-w /usr/bin/ss -p x -k susp_activity
-w /usr/bin/netstat -p x -k susp_activity
-w /usr/bin/ssh -p x -k susp_activity
-w /usr/bin/scp -p x -k susp_activity
-w /usr/bin/sftp -p x -k susp_activity
-w /usr/bin/ftp -p x -k susp_activity
-w /usr/bin/socat -p x -k susp_activity
-w /usr/bin/nmap -p x -k susp_activity
-w /bin/nc.openbsd -p x -k susp_activity
-w /bin/nc.traditional -p x -k susp_activity

# ── Data compression / exfil staging (T1002 → Wazuh rule 210111) ─────────────
-w /usr/bin/zip -p x -k T1002_Data_Compressed
-w /usr/bin/gzip -p x -k T1002_Data_Compressed
-w /usr/bin/tar -p x -k T1002_Data_Compressed
-w /usr/bin/bzip2 -p x -k T1002_Data_Compressed
-w /usr/bin/zstd -p x -k T1002_Data_Compressed

# ── Network exfiltration — raw socket (T1011 → Wazuh rule 210113) ────────────
-a always,exit -F arch=b32 -S socket -F a0=0x2 -F key=T1011_Exfiltration_Over_Other_Network_Medium
-a always,exit -F arch=b64 -S socket -F a0=0x2 -F key=T1011_Exfiltration_Over_Other_Network_Medium
-a always,exit -F arch=b32 -S socket -F a0=0xA -F key=T1011_Exfiltration_Over_Other_Network_Medium
-a always,exit -F arch=b64 -S socket -F a0=0xA -F key=T1011_Exfiltration_Over_Other_Network_Medium

# ── Rootcmd — non-root user running as root (rootcmd → Wazuh rule 210102) ────
-a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=-1 -F key=rootcmd
-a always,exit -F arch=b32 -S execve -F euid=0 -F auid>=1000 -F auid!=-1 -F key=rootcmd

# ── Process injection via ptrace (→ Wazuh rule 210110) ───────────────────────
-a always,exit -F arch=b32 -S ptrace -F a0=0x4 -F key=code_injection
-a always,exit -F arch=b64 -S ptrace -F a0=0x4 -F key=code_injection
-a always,exit -F arch=b32 -S ptrace -F a0=0x5 -F key=data_injection
-a always,exit -F arch=b64 -S ptrace -F a0=0x5 -F key=data_injection
-a always,exit -F arch=b32 -S ptrace -F a0=0x6 -F key=register_injection
-a always,exit -F arch=b64 -S ptrace -F a0=0x6 -F key=register_injection

# ── Permission modification (perm_mod → Wazuh rule 210112) ───────────────────
-a always,exit -F arch=b64 -S chmod -F auid>=1000 -F auid!=-1 -F key=perm_mod
-a always,exit -F arch=b64 -S chown -F auid>=1000 -F auid!=-1 -F key=perm_mod
-a always,exit -F arch=b64 -S fchmod -F auid>=1000 -F auid!=-1 -F key=perm_mod
-a always,exit -F arch=b64 -S fchown -F auid>=1000 -F auid!=-1 -F key=perm_mod

# ── Credential search tools (T1081 → Wazuh rule 210114) ──────────────────────
-w /usr/bin/grep -p x -k T1081_Credentials_In_Files
-w /usr/bin/rg -p x -k T1081_Credentials_In_Files
-w /usr/bin/ag -p x -k T1081_Credentials_In_Files

# ── Power / shutdown ──────────────────────────────────────────────────────────
-w /sbin/shutdown -p x -k power
-w /sbin/poweroff -p x -k power
-w /sbin/reboot -p x -k power
-w /sbin/halt -p x -k power

# ── Manually added during lab testing ────────────────────────────────────────
-w /etc/shadow -p rwa -k shadow_access
-w /etc/passwd -p rwa -k passwd_access
