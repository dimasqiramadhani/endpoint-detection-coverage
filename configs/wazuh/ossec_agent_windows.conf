<!--
  ossec.conf, Wazuh Agent (winsrv-agent / Windows Server 2019 Standard)
  Agent ID : 002
  Manager  : ubnsrv-aio (IP redacted)
  Version  : Wazuh v4.14.5

  This file shows only the relevant <client> and <localfile> sections.
-->

<ossec_config>

  <!-- Manager connection -->
  <client>
    <server>
      <address>MANAGER_IP</address>
    </server>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
  </client_buffer>

  <!-- Windows Event Log channels -->

  <!-- Application log -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Security log, with noise filter for high-volume event IDs -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID != 5145 and EventID != 5156 and EventID != 5447 and
      EventID != 4656 and EventID != 4658 and EventID != 4663 and EventID != 4660 and
      EventID != 4670 and EventID != 4690 and EventID != 4703 and EventID != 4907 and
      EventID != 5152 and EventID != 5157]</query>
  </localfile>

  <!-- System log -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Active response log -->
  <localfile>
    <location>active-response\active-responses.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- Sysmon v15.20, process creation, network, file, registry, DNS -->
  <!-- Config file: C:\Sysmon\sysmonconfig.xml -->
  <!-- Hashing: MD5, SHA256, IMPHASH -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Operational log, script block logging, module logging -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</ossec_config>
