<!--
  ossec.conf, Wazuh Agent (ubnsrv-agent / Ubuntu 22.04.5 LTS)
  Agent ID : 001
  Manager  : ubnsrv-aio (IP redacted)
  Version  : Wazuh v4.14.5

  This file shows only the relevant <client> and <localfile> sections.
  The full ossec.conf includes additional sections (syscheck, rootcheck, etc.)
  that are left at defaults and not shown here.
-->

<ossec_config>

  <!-- Manager connection -->
  <client>
    <server>
      <address>MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- System command monitoring (built-in defaults) -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <!-- auditd log collection -->
  <!-- log_format must be "audit" to use Wazuh's built-in auditd decoders -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Falco alert collection -->
  <!-- Falco configured to output JSON to this path (keep_alive: true) -->
  <!-- log_format must be "json" to parse Falco JSON output correctly -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/falco_events.json</location>
  </localfile>

  <!-- Systemd journal -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!-- Active response log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- dpkg package manager log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

</ossec_config>
